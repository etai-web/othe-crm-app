name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Generate Android project and apply OTHE customisations
        run: |
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.OTHE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/othe-release.jks"
            echo "OTHE_KEYSTORE_PATH=$RUNNER_TEMP/othe-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No OTHE signing key secret set; this APK is signed with a temporary TEST key."
          fi

      - name: Build release APK
        working-directory: android
        env:
          OTHE_KEYSTORE_PASSWORD: ${{ secrets.OTHE_KEYSTORE_PASSWORD }}
          OTHE_KEY_ALIAS: ${{ secrets.OTHE_KEY_ALIAS }}
          OTHE_KEY_PASSWORD: ${{ secrets.OTHE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        id: apk
        run: |
          src=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          name="OTHE-CRM-1.1.${GITHUB_RUN_NUMBER}.apk"
          cp "$src" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -la "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}

      # Only builds signed with the permanent OTHE key are published as releases.
      # Builds without the key stay as a downloadable artifact on the workflow run.
      - name: Publish as a GitHub release
        if: env.OTHE_KEYSTORE_PATH != '' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="1.1.${GITHUB_RUN_NUMBER}"
          gh release create "v$ver" "${{ steps.apk.outputs.name }}" \
            --target "$GITHUB_SHA" \
            --title "OTHE CRM Android $ver" \
            --notes "Live OTHE CRM technician app for Android, signed with the permanent OTHE key. Installs over the previous version."

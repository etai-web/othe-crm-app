name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Generate Android project and apply OTHE customisations
        run: |
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.OTHE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/othe-release.jks"
            echo "OTHE_KEYSTORE_PATH=$RUNNER_TEMP/othe-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No OTHE signing key secret set; this APK is signed with a temporary TEST key."
          fi

      - name: Build release APK
        working-directory: android
        env:
          OTHE_KEYSTORE_PASSWORD: ${{ secrets.OTHE_KEYSTORE_PASSWORD }}
          OTHE_KEY_ALIAS: ${{ secrets.OTHE_KEY_ALIAS }}
          OTHE_KEY_PASSWORD: ${{ secrets.OTHE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify the APK is signed with the OTHE key
        if: env.OTHE_KEYSTORE_PATH != ''
        run: |
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          signer=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          "$signer" verify --print-certs "$apk" | tee signer.txt
          grep -q "On Time Home Experts" signer.txt || { echo "::error::APK is not signed with the OTHE key"; exit 1; }
          echo "::notice::APK signed with the permanent OTHE key"

      - name: Verify location permission applies to all Android versions
        run: |
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          aapt=$(ls $ANDROID_HOME/build-tools/*/aapt | sort -V | tail -1)
          "$aapt" dump permissions "$apk" | tee perms.txt
          grep "ACCESS_FINE_LOCATION" perms.txt | grep -q "maxSdkVersion" && { echo "::error::ACCESS_FINE_LOCATION is limited by maxSdkVersion - Tap to Pay would fail on Android 12+"; exit 1; } || true
          grep -q "ACCESS_FINE_LOCATION" perms.txt || { echo "::error::ACCESS_FINE_LOCATION missing"; exit 1; }

      - name: Collect APK
        id: apk
        run: |
          src=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          name="OTHE-CRM-1.1.${GITHUB_RUN_NUMBER}.apk"
          cp "$src" "$name"
          # Fixed-name copy so the website can always link to
          # https://github.com/etai-web/othe-crm-app/releases/latest/download/OTHE-CRM.apk
          cp "$src" OTHE-CRM.apk
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -la "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}

      # A new release is published only when the commit message contains "[release]"
      # (or the workflow is started by hand), and only if the APK is signed with the
      # permanent OTHE key. Other builds stay as a downloadable artifact on the run.
      - name: Publish as a GitHub release
        if: env.OTHE_KEYSTORE_PATH != '' && github.ref_name == 'main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="1.1.${GITHUB_RUN_NUMBER}"
          gh release create "v$ver" "${{ steps.apk.outputs.name }}" OTHE-CRM.apk \
            --target "$GITHUB_SHA" \
            --title "OTHE CRM Android $ver" \
            --notes "Live OTHE CRM technician app for Android, signed with the permanent OTHE key. Installs over the previous version."
